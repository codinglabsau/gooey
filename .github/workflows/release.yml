name: Release

on:
  release:
    types: [published]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish-gpr:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com/
          scope: '@codinglabsau'

      - run: npm ci

      # dist is not committed; build it here rather than from a lifecycle hook,
      # which `ignore-scripts` would silently skip and publish an empty package.
      - run: npx vite build

      - name: Verify the build produced a publishable dist
        run: test -f dist/gooey.js && test -f dist/types/index.d.ts

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Extract Package Version
        id: extract-version
        run: echo "VERSION=$(awk -F '\"' '/version/{print $4}' package.json)" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        run: |
          curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"Gooey $VERSION version was published\"}" $SLACK_WEBHOOK
        env:
          VERSION: ${{ steps.extract-version.outputs.VERSION }}
          SLACK_WEBHOOK: ${{ secrets.CODINGLABS_SLACK_WEBHOOK }}
