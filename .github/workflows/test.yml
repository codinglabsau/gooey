name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: both jobs only read the checkout. Without this the workflow
# inherits the repository default, which CodeQL flags as overly broad
# (actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: cypress-io/github-action@v6
        with:
          # dist is not committed, and the import-safety check below asserts
          # against the built bundle, so build before the suite runs.
          build: npx vite build
          start: npm run dev

      # A file read and a regex — a plain Node check rather than a browser test.
      - run: npm run check:import-safety

  type-check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run type-check
